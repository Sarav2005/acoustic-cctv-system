spring.application.name=acoustic-cctv-backend
server.port=8080

# Webcam/CCTV frames can exceed Spring's 1MB default upload limit.
# Raised further (10MB -> 200MB) for the new video-clip upload endpoint
# (/api/captures/video) - a 20-30s continuous recording at webcam
# resolution is much bigger than a single JPEG frame. Applies to both
# still-frame and video uploads since Spring's multipart limit is global.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Keep logs readable while wiring modules together
logging.level.com.acousticcctv=DEBUG